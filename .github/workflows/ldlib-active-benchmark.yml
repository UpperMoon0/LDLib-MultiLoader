name: LDLib active GTCEu + JFR A/B benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - '1.20.1-nstut'
      - 'bench/**'
    paths:
      - '.github/workflows/ldlib-active-benchmark.yml'
      - 'benchmarks/ldlib_active_benchmark.py'
      - 'benchmarks/injected-src/**'
      - 'benchmarks/test_active_benchmark.py'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/async/**'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/syncdata/**'
  pull_request:
    branches:
      - '1.20.1-nstut'
    paths:
      - '.github/workflows/ldlib-active-benchmark.yml'
      - 'benchmarks/ldlib_active_benchmark.py'
      - 'benchmarks/injected-src/**'
      - 'benchmarks/test_active_benchmark.py'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/async/**'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/syncdata/**'

permissions:
  contents: read

concurrency:
  group: ldlib-active-benchmark-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  active-gtceu:
    name: Real GTCEu recipe progress + tick interval + JFR
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate baseline and active harness tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ldlib_benchmark.py benchmarks/ldlib_active_benchmark.py
          python3 -m unittest discover -s benchmarks -p 'test_*.py' -v
          git cat-file -e 1d4e4390ae58d16038845c651e122185c29f334b^{commit}

      - name: Build fork with identical CI-only GTCEu hook
        shell: bash
        run: |
          set -euo pipefail
          dst=forge/src/main/java/com/lowdragmc/lowdraglib/bench
          mkdir -p "$dst"
          cp benchmarks/injected-src/ActiveGtceuProfiler.java "$dst/"
          bash ./gradlew :ldlib-forge:remapJar --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3G -XX:MaxMetaspaceSize=768m"
          mkdir -p benchmark-active-input
          jar=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev*.jar' ! -name '*-sources.jar' ! -name '*javadoc*.jar' | head -n 1)
          test -n "$jar"
          unzip -Z1 "$jar" | grep -q 'ActiveGtceuProfiler.class'
          cp "$jar" benchmark-active-input/ldlib-fork-active.jar

      - name: Build pinned upstream with same CI-only GTCEu hook
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/ldlib-active-upstream" 1d4e4390ae58d16038845c651e122185c29f334b
          (
            cd "$RUNNER_TEMP/ldlib-active-upstream"
            dst=forge/src/main/java/com/lowdragmc/lowdraglib/bench
            mkdir -p "$dst"
            cp "$GITHUB_WORKSPACE/benchmarks/injected-src/ActiveGtceuProfiler.java" "$dst/"
            bash ./gradlew :ldlib-forge:remapJar --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3G -XX:MaxMetaspaceSize=768m"
            jar=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev*.jar' ! -name '*-sources.jar' ! -name '*javadoc*.jar' | head -n 1)
            test -n "$jar"
            unzip -Z1 "$jar" | grep -q 'ActiveGtceuProfiler.class'
            cp "$jar" "$GITHUB_WORKSPACE/benchmark-active-input/ldlib-upstream-active.jar"
          )
          sha256sum benchmark-active-input/*jar > benchmark-active-input/sha256.txt
          sha256sum benchmarks/injected-src/ActiveGtceuProfiler.java >> benchmark-active-input/sha256.txt
          printf 'upstream=1d4e4390ae58d16038845c651e122185c29f334b\nfork=%s\n' \
            "$(git rev-parse HEAD)" > benchmark-active-input/revisions.txt

      - name: Assemble isolated pinned Forge 1.20.1 and GTCEu 7.5.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-active-template/mods
          curl -fsSL --retry 3 -o benchmark-active-template/mods/gtceu-1.20.1-7.5.3.jar \
            'https://github.com/GregTechCEu/GregTech-Modern/releases/download/v7.5.3-1.20.1/gtceu-1.20.1-7.5.3.jar'
          echo "d6560d8b695828a763389d3f45e0210ef70c1892c7b1633ac458544905df1a0d  benchmark-active-template/mods/gtceu-1.20.1-7.5.3.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o benchmark-active-template/mods/configuration-forge-1.20.1-3.1.0.jar \
            'https://mediafilez.forgecdn.net/files/5840/405/configuration-forge-1.20.1-3.1.0.jar'
          echo "8757a9f1d47f48463765d1d202cdadc41c84f6b0  benchmark-active-template/mods/configuration-forge-1.20.1-3.1.0.jar" | sha1sum -c -
          curl -fsSL --retry 3 -o benchmark-active-template/forge-installer.jar \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.13/forge-1.20.1-47.4.13-installer.jar'
          (
            cd benchmark-active-template
            java -jar forge-installer.jar --installServer > installer.log 2>&1 || {
              tail -n 110 installer.log
              exit 1
            }
            test -f run.sh
            printf 'eula=true\n' > eula.txt
            printf '%s\n' '-Xms512M' '-Xmx3G' > user_jvm_args.txt
          )

      - name: Run paired active recipe benchmark and capture JFR
        shell: bash
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_NUMBER % 2 == 0 )); then order=upstream-first; else order=fork-first; fi
          python3 benchmarks/ldlib_active_benchmark.py \
            --template benchmark-active-template \
            --upstream-jar benchmark-active-input/ldlib-upstream-active.jar \
            --fork-jar benchmark-active-input/ldlib-fork-active.jar \
            --output benchmark-active-results \
            --warmup 12 --duration 35 --order "$order"
          cat benchmark-active-results/ACTIVE_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive JFR, tick traces, machine-output evidence and build identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldlib-active-gtceu-jfr-benchmark
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          path: |
            benchmark-active-results/ACTIVE_SUMMARY.md
            benchmark-active-results/active-measurements.json
            benchmark-active-results/active-incomplete.txt
            benchmark-active-results/**/ldlib-active-metrics.csv
            benchmark-active-results/**/ldlib-active-flight.jfr
            benchmark-active-results/**/benchmark-console.log
            benchmark-active-results/**/logs/latest.log
            benchmark-active-input/sha256.txt
            benchmark-active-input/revisions.txt
            benchmark-active-template/installer.log
