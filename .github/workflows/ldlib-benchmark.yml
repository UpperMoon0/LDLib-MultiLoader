name: LDLib upstream vs fork CPU benchmark

on:
  # This repository's default branch is intentionally pristine upstream.
  # Push and PR events run this workflow on the downstream integration branch;
  # workflow_dispatch is available only if GitHub can see it on the default branch.
  workflow_dispatch:
  push:
    branches:
      - '1.20.1-nstut'
      - 'bench/**'
    paths:
      - '.github/workflows/ldlib-benchmark.yml'
      - 'benchmarks/**'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/async/**'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/syncdata/**'
  pull_request:
    branches:
      - '1.20.1-nstut'
    paths:
      - '.github/workflows/ldlib-benchmark.yml'
      - 'benchmarks/**'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/async/**'
      - 'common/src/main/java/com/lowdragmc/lowdraglib/syncdata/**'

permissions:
  contents: read

concurrency:
  group: ldlib-benchmark-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compare-cpu:
    name: Benchmark idle GTCEu managed-sync CPU
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate harness syntax and pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ldlib_benchmark.py
          python3 -m unittest discover -s benchmarks -p 'test_*.py' -v
          git cat-file -e 1d4e4390ae58d16038845c651e122185c29f334b^{commit}

      - name: Build fork Forge jar
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :ldlib-forge:remapJar --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3G -XX:MaxMetaspaceSize=768m"
          mkdir -p benchmark-input
          jar=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev*.jar' ! -name '*-sources.jar' ! -name '*javadoc*.jar' | head -n 1)
          test -n "$jar"
          cp "$jar" benchmark-input/ldlib-fork.jar

      - name: Build pristine upstream Forge jar at exact pinned SHA
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/ldlib-pristine" 1d4e4390ae58d16038845c651e122185c29f334b
          (
            cd "$RUNNER_TEMP/ldlib-pristine"
            bash ./gradlew :ldlib-forge:remapJar --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3G -XX:MaxMetaspaceSize=768m"
            jar=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev*.jar' ! -name '*-sources.jar' ! -name '*javadoc*.jar' | head -n 1)
            test -n "$jar"
            cp "$jar" "$GITHUB_WORKSPACE/benchmark-input/ldlib-upstream.jar"
          )
          sha256sum benchmark-input/*.jar > benchmark-input/jar-hashes.txt
          printf 'upstream=1d4e4390ae58d16038845c651e122185c29f334b\nfork=%s\n' \
            "$(git rev-parse HEAD)" > benchmark-input/source-revisions.txt

      - name: Assemble identical isolated Forge / GTCEu server template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-template/mods
          curl -fsSL --retry 3 -o benchmark-template/mods/gtceu-1.20.1-7.5.3.jar \
            'https://github.com/GregTechCEu/GregTech-Modern/releases/download/v7.5.3-1.20.1/gtceu-1.20.1-7.5.3.jar'
          echo "d6560d8b695828a763389d3f45e0210ef70c1892c7b1633ac458544905df1a0d  benchmark-template/mods/gtceu-1.20.1-7.5.3.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o benchmark-template/mods/configuration-forge-1.20.1-3.1.0.jar \
            'https://mediafilez.forgecdn.net/files/5840/405/configuration-forge-1.20.1-3.1.0.jar'
          echo "8757a9f1d47f48463765d1d202cdadc41c84f6b0  benchmark-template/mods/configuration-forge-1.20.1-3.1.0.jar" | sha1sum -c -
          curl -fsSL --retry 3 -o benchmark-template/forge-installer.jar \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.13/forge-1.20.1-47.4.13-installer.jar'
          (
            cd benchmark-template
            java -jar forge-installer.jar --installServer > installer.log 2>&1 || {
              tail -n 100 installer.log
              exit 1
            }
            test -f run.sh
            printf 'eula=true\n' > eula.txt
            printf '%s\n' '-Xms512M' '-Xmx3G' > user_jvm_args.txt
          )

      - name: Measure matched managed-sync workloads
        shell: bash
        run: |
          set -euo pipefail
          # Alternate which version runs first across CI runs to reduce
          # systematic effects from host warmup (not a substitute for repeats).
          if (( GITHUB_RUN_NUMBER % 2 == 0 )); then
            order=upstream-first
          else
            order=fork-first
          fi
          python3 benchmarks/ldlib_benchmark.py \
            --template benchmark-template \
            --upstream-jar benchmark-input/ldlib-upstream.jar \
            --fork-jar benchmark-input/ldlib-fork.jar \
            --output benchmark-results \
            --warmup 20 --duration 40 --order "$order"
          cat benchmark-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics, audit logs and JAR identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldlib-upstream-fork-cpu-benchmark
          if-no-files-found: warn
          retention-days: 14
          path: |
            benchmark-results/SUMMARY.md
            benchmark-results/measurements.json
            benchmark-results/incomplete.txt
            benchmark-results/**/benchmark-console.log
            benchmark-results/**/logs/latest.log
            benchmark-input/jar-hashes.txt
            benchmark-input/source-revisions.txt
            benchmark-template/installer.log
