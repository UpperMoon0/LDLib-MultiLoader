name: Sync regressions

on:
  push:
    branches:
      - 'fix/**'
      - '1.20.1-nstut'
  pull_request:
    branches:
      - '1.20.1-nstut'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-regression-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Common regression tests and Forge compilation
        run: bash ./gradlew :ldlib-common:test :ldlib-forge:compileJava :ldlib-fabric:compileJava --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3G -XX:MaxMetaspaceSize=768m"
